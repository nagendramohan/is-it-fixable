name: Release

# Publishes to npm when a version tag (v*) is pushed, e.g. `git tag v0.2.0 && git push origin v0.2.0`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # enables npm provenance (supply-chain attestation)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      # Full quality gate before anything is published.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Guard: the git tag (vX.Y.Z) must match package.json's version.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
